[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deepmask"
description = "Accurate Brain Segmentation in Malformations of Cortical Development using V-net"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Ravnoor Gill", email = "ravnoor.gill@mail.mcgill.ca"},
    {name = "Benoit Caldairou"},
    {name = "Neda Bernasconi"},
    {name = "Andrea Bernasconi"},
]
maintainers = [
    {name = "Ravnoor Gill", email = "ravnoor.gill@mail.mcgill.ca"},
]
keywords = ["brain", "segmentation", "mri", "pytorch", "medical", "imaging", "vnet", "cortical-malformations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing"
]
requires-python = ">=3.8,<3.12"
dependencies = [
    "torch==1.8.2",
    "torchvision==0.9.2", 
    "antspyx>=0.4.0,<0.5.0",
    # "antspynet>=0.2.0,<0.3.0",  # Temporarily disabled due to TensorFlow conflicts
    "nibabel>=3.0.0",
    "numpy>=1.19.0,<1.22.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "mo-dots>=9.0.0",
    "psutil>=5.9.0",
    "setproctitle>=1.2.0",
    "gast>=0.2.1,<=0.4.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
    "twine",
]
test = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-mock",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]
antspynet = [
    "antspynet>=0.2.0,<0.3.0",
    "tensorflow>=2.4.0,<2.8.0",
]
cuda = [
    # CUDA 11.1 wheels from PyTorch LTS
    "torch==1.8.2+cu111",
    "torchvision==0.9.2+cu111",
]

[project.urls]
Homepage = "https://github.com/NOEL-MNI/deepMask"
Repository = "https://github.com/NOEL-MNI/deepMask"
Documentation = "https://github.com/NOEL-MNI/deepMask#readme"
"Bug Tracker" = "https://github.com/NOEL-MNI/deepMask/issues"
Changelog = "https://github.com/NOEL-MNI/deepMask/releases"

[project.scripts]
deepmask-inference = "deepMask.inference:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "deepMask/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["deepMask"]
include = [
    "deepMask/weights/",
    "deepMask/template/",
    "deepMask/utils/dense3dCrf/",
]

[tool.hatch.build.targets.sdist]
include = [
    "/deepMask",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# uv configuration
[tool.uv]
dev-dependencies = [
    "hatchling",
    "hatch-vcs",
    "pytest>=6.0",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
    "twine",
]

# uv workspace configuration
[tool.uv.workspace]
members = ["."]

# uv pip configuration
[tool.uv.pip]
index-strategy = "unsafe-best-match"
extra-index-url = ["https://download.pytorch.org/whl/lts/1.8/cpu"]

# uv sources for dependency resolution
[tool.uv.sources]
# Configure CUDA packages to use CUDA index when cuda extra is requested
torch = { index = "pytorch-cuda", marker = "extra == 'cuda'" }
torchvision = { index = "pytorch-cuda", marker = "extra == 'cuda'" }

# Define the PyTorch indexes
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/lts/1.8/cu111/"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["deepmask"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "antspyx.*",
    "antspynet.*",
    "nibabel.*",
    "mo_dots.*",
]
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["deepmask"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
