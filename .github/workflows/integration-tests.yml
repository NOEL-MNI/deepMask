name: Integration Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  CI_TESTING: true
  CI_TESTING_PATIENT_ID: "sub-00055"

jobs:
  run-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv sync --python 3.8 --dev --extra cpu

    - name: Download test data
      run: |
        export TMPDIR=test_output
        PATIENT_ID=sub-00055
        BASE_URL=https://s3.amazonaws.com/openneuro.org/ds004199/${PATIENT_ID}/anat
        mkdir -p ${TMPDIR}/${PATIENT_ID}
        echo "Downloading test dataset..."
        
        # Download T1 image
        curl -L "${BASE_URL}/${PATIENT_ID}_acq-sag111_T1w.nii.gz?versionId=IKGWDiLR7B7ls2yPVyycJo.6R1Sqhujf" \
          -o ${TMPDIR}/${PATIENT_ID}/t1.nii.gz
        
        # Download FLAIR image  
        curl -L "${BASE_URL}/${PATIENT_ID}_acq-tse3dvfl_FLAIR.nii.gz?versionId=HmzYoUuYkdbyd8jkpdJjVkZydRHNSqUX" \
          -o ${TMPDIR}/${PATIENT_ID}/flair.nii.gz

    - name: Run deepMask inference
      timeout-minutes: 15  # Inference should complete within 15 minutes
      run: |
        export TMPDIR=test_output
        mkdir -p ${TMPDIR}/sub-00055
        
        # Run deepMask inference with just filenames (not full paths)
        uv run deepmask-inference sub-00055 \
          t1.nii.gz \
          flair.nii.gz \
          ${TMPDIR}
        
        # Verify key output files were created
        ls -la ${TMPDIR}/sub-00055/
      env:
        CI_TESTING_PATIENT_ID: "sub-00055"
        CI_TESTING_PRED_DIR: "test_output"

    - name: Upload inference outputs
      uses: actions/upload-artifact@v4
      with:
        name: inference-outputs
        path: test_output/
        retention-days: 1

  run-integration-tests:
    needs: run-inference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv sync --python 3.8 --dev --extra cpu

    - name: Download inference outputs
      uses: actions/download-artifact@v4
      with:
        name: inference-outputs
        path: test_output/

    - name: Run integration tests
      run: |
        uv run pytest tests/test_integration.py -v -s
      env:
        CI_TESTING_PATIENT_ID: "sub-00055"
        CI_TESTING_PRED_DIR: "test_output"
        CI_TESTING_REF_DIR: "tests/reference_data"
