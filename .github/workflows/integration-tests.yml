name: Integration Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  CI_TESTING: true
  CI_TESTING_PATIENT_ID: "sub-00055"

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download test data
      run: |
        PATIENT_ID=sub-00055
        BASE_URL=https://s3.amazonaws.com/openneuro.org/ds004199/${PATIENT_ID}/anat
        mkdir -p test_data/${PATIENT_ID}
        echo "Downloading test dataset..."
        
        # Download T1 image
        curl -L "${BASE_URL}/${PATIENT_ID}_acq-sag111_T1w.nii.gz?versionId=IKGWDiLR7B7ls2yPVyycJo.6R1Sqhujf" \
          -o test_data/${PATIENT_ID}/t1.nii.gz
        
        # Download FLAIR image  
        curl -L "${BASE_URL}/${PATIENT_ID}_acq-tse3dvfl_FLAIR.nii.gz?versionId=HmzYoUuYkdbyd8jkpdJjVkZydRHNSqUX" \
          -o test_data/${PATIENT_ID}/flair.nii.gz

    - name: Upload test data
      uses: actions/upload-artifact@v4
      with:
        name: test-data
        path: test_data/
        retention-days: 1

  run-inference:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv sync --python 3.8 --dev --extra cpu

    - name: Download test data
      uses: actions/download-artifact@v4
      with:
        name: test-data
        path: test_data/

    - name: Run deepMask inference
      timeout-minutes: 15  # Inference should complete within 15 minutes
      run: |
        # Run deepMask inference
        uv run deepmask-inference sub-00055 \
          test_data/sub-00055/t1.nii.gz \
          test_data/sub-00055/flair.nii.gz \
          .
        
        # Verify key output files were created
        ls -la ./sub-00055/
      env:
        CI_TESTING_PATIENT_ID: "sub-00055"
        CI_TESTING_PRED_DIR: "test_data"

    - name: Upload inference outputs
      uses: actions/upload-artifact@v4
      with:
        name: inference-outputs
        path: test_data/
        retention-days: 1

  run-integration-tests:
    needs: [prepare-data, run-inference]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv sync --python 3.8 --dev --extra cpu

    - name: Download test data and inference outputs
      uses: actions/download-artifact@v4
      with:
        name: inference-outputs
        path: test_data/

    - name: Run integration tests
      run: |
        uv run pytest tests/test_integration.py -v -s
      env:
        CI_TESTING_PATIENT_ID: "sub-00055"
        CI_TESTING_PRED_DIR: "test_data"
        CI_TESTING_REF_DIR: "tests/reference_data"
